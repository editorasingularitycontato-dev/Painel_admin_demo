function teamView(){return `<h1>Equipe e permissões</h1><p>Gerencie os acessos ao painel administrativo.</p><div class="panel"><div class="row between"><h2>Equipe Singularity</h2><small>3 integrantes · 1 integração prevista</small></div><div class="team-grid">${teamMembers.map((m,i)=>`<div class="team-card"><div class="row"><div class="team-avatar">${m.initial}</div><div><h3>${m.name}</h3><small>${m.role}</small></div></div><p>${m.dept}</p><span class="tag">${m.locked?'Acesso integral':i===3?'Não conectado':'Acesso personalizado'}</span><div class="team-perms">${teamAreas.map((a,j)=>`<div class="row between"><small>${a}</small>${teamEdit===i&&!m.locked?`<select aria-label="${a}" onchange="teamMembers[${i}].access[${j}]=Number(this.value)">${['Sem acesso','Visualizar','Editar'].map((v,k)=>`<option value="${k}" ${m.access[j]===k?'selected':''}>${v}</option>`).join('')}</select>`:`<small>${['Sem acesso','Visualizar','Editar'][m.access[j]]}</small>`}</div>`).join('')}</div>${m.locked?'<small>Permissões administrativas protegidas.</small>':`<button onclick="teamEdit=teamEdit===${i}?-1:${i};render()">${teamEdit===i?'Concluir simulação':'Personalizar acesso'}</button>`}</div>`).join('')}</div></div><div class="panel" style="margin-top:16px"><h2>Segurança e histórico</h2><p>Somente a administradora principal poderá alterar permissões. As operações da integração terão identidade própria e registro de auditoria.</p><small>Protótipo: alterações apenas em memória. Não concede acesso real nem conecta o Claude.</small></div>`}

let settingsName='Marcela Delfina';
function settingsView(){return `<h1>Configurações</h1><p>Preferências da conta e administração do portal.</p><div class="settings-grid"><div class="panel"><h2>Minha conta</h2><div class="row"><div class="team-avatar" id="settingsAvatar">MD</div><div><b>Perfil administrativo</b><br><small>Diretoria Executiva</small></div></div><label for="settingsPhoto">Foto de perfil</label><input id="settingsPhoto" type="file" accept="image/*" onchange="previewSettingsPhoto(this)"><label for="settingsName">Nome</label><input id="settingsName" value="${settingsName.replace(/[&<>"']/g,'')}"><label for="settingsEmail">E-mail</label><input id="settingsEmail" type="email" placeholder="E-mail da conta"><p><button onclick="settingsName=document.getElementById('settingsName').value;document.getElementById('settingsFeedback').textContent='Alteração simulada nesta sessão.'">Salvar simulação</button> <button onclick="document.getElementById('settingsFeedback').textContent='Redefinição de senha disponível após integração de autenticação.'">Alterar senha</button></p><small id="settingsFeedback" class="settings-feedback"></small></div><div class="panel"><h2>Identidade da editora</h2><div class="line"><small>Nome institucional</small><p>Editora Singularity</p></div><div class="line"><small>Identidade visual</small><p>Vermelho, rosa e creme · logotipo institucional</p></div><small>Alterações institucionais restritas à Diretoria Executiva.</small></div><div class="panel"><h2>Configurações editoriais</h2><details><summary>Etapas da jornada editorial</summary>${stages.map((x,i)=>`<div class="line">${i+1}. ${x}</div>`).join('')}</details><div class="line"><b>Categorias de documentos</b><p>Contratos, manuscritos, briefings, capas, ilustrações e diagramação.</p></div><small>Personalização prevista na implementação funcional.</small></div><div class="panel"><h2>Configurações financeiras</h2><div class="line"><b>Apuração trimestral</b><p>Prestação de contas por trimestre civil.</p></div><div class="line"><b>Percentuais de royalties</b><p>Definidos por canal e contrato individual.</p></div><small>Alterações não devem modificar retroativamente contratos ou apurações.</small></div><div class="panel"><h2>Integrações</h2>${[['Claude','Atualizações operacionais'],['Bling','Vendas e estoque'],['Resend','Notificações por e-mail']].map(x=>`<div class="line row between"><div><b>${x[0]}</b><br><small>${x[1]}</small></div><span class="tag">Não conectado</span></div>`).join('')}</div><div class="panel"><h2>Segurança</h2><div class="line"><b>Histórico de acessos</b><p>Nenhum registro real neste protótipo.</p></div><div class="line"><b>Histórico de alterações</b><p>Registro de responsável, data e alterações previsto.</p></div><button onclick="go(7)">Gerenciar permissões</button></div></div>`}
function previewSettingsPhoto(input){const f=input.files[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{const a=document.getElementById('settingsAvatar');if(a){a.textContent='';const img=document.createElement('img');img.src=r.result;img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';a.appendChild(img)}};r.readAsDataURL(f)}

function render(){document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${x}</button>`).join('');let h='';if(page===0){h=`<h1>Visão geral</h1><p>O que está acontecendo no nosso jardim literário.</p><div class="grid">${[['Livros em produção','1'],['Livros em pré-venda','0'],['Livros em gráfica','0'],['Obras publicadas','1'],['Aprovações pendentes','2'],['Próximas ações','3']].map(x=>`<div class="panel"><small>${x[0]}</small><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="cols"><div class="panel"><div class="row between"><h2>Livros em andamento</h2><button onclick="go(2)">Ver estante</button></div><div id="miniCarousel">${miniCarousel()}</div><div class="legend"><span>🔴 ! Atenção</span><span>🟢 ✓ Em dia</span><span>🟠 … Aguardando</span></div><small class="shelf-note">Navegue pelas setas ou abra a estante completa. Capas de exemplo testam a navegação.</small></div><div><div class="panel"><h2>Precisa de atenção</h2><div class="line">Conferir aprovação da capa <p><small>Editorial · exemplo</small></p></div><div class="line">Revisar relatório de royalties <p><small>Financeiro · exemplo</small></p></div></div><div class="panel"><h2>Próximas ações</h2><p>Atualizar jornada editorial</p><p>Conferir estoque</p><p>Preparar comunicado ao autor</p></div></div></div>`}else if(page===1){if(authorSelected<0){h=`<h1>Autores</h1><p>Gerencie os autores e suas obras vinculadas.</p><div class="panel"><div class="row between"><h2>Cadastro de autores</h2><small>${authors().length} autores</small></div><input id="authorSearch" placeholder="Buscar autor ou livro" oninput="authorQ=this.value;authorList()"><div id="authorResults"></div></div>`}else{const name=authors()[authorSelected];h=`<button onclick="authorSelected=-1;render()">‹ Voltar aos autores</button><div class="panel" style="margin-top:16px"><h1>${name}</h1><p>Perfil demonstrativo · dados cadastrais e permissões ainda não integrados.</p><h2>Obras vinculadas</h2><div class="shelf">${books.map((b,i)=>({...b,i})).filter(b=>b.author===name).map(b=>`<button class="book" onclick="openBook(${b.i})"><img src="${covers[b.i]}" alt="Capa"><b>${b.title}</b>${progressCard(b)}</button>`).join('')}</div></div>`}}else if(page===2&&selected<0){h=`<h1>Nossa estante</h1><p>Gerencie o catálogo e acompanhe cada obra.</p><div class="panel"><div class="row between"><input placeholder="Buscar livro ou autor" oninput="q=this.value;shelf()" id="search"><select onchange="filter=this.value;shelf()">${['Todos','Em produção','Pré-venda','Em gráfica','Publicado'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select><div class="row"><button onclick="mode='shelf';render()" class="${mode==='shelf'?'active':''}">Estante</button><button onclick="mode='list';render()" class="${mode==='list'?'active':''}">Lista</button></div></div><div id="results"></div></div>`}else if(page===2){let b=books[selected];let ts=['Visão geral','Jornada editorial','Documentos','Estoque e vendas','Financeiro','Comunicados'];h=`<button onclick="go(2)">‹ Voltar à estante</button><div class="panel" style="margin-top:16px"><div class="row"><img class="cover" src="${covers[selected]}"><div><h1>${b.title}</h1><p>${b.author}</p><span class="tag">${b.status}</span></div></div><div class="tabs">${ts.map((t,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('')}</div>${tab===0?`<h2>Resumo da obra</h2><p>Responsável: ${b.owner}</p><div class="bar"><i style="width:${b.progress}%"></i></div><p>${b.progress}% da jornada · exemplo</p>`:tab===1?stages.map((t,i)=>`<div class="row between line"><b>${i+1}. ${t}</b><span class="tag">${i<b.progress/10?'Concluído':'Pendente'}</span></div>`).join(''):tab===3?`<h2>Estoque da obra</h2><div class="grid">${Object.entries(inventory[selected]).map(([k,v])=>`<div class="panel"><small>${({produced:"Produzidos",available:"Disponíveis",sold:"Vendidos"})[k]}</small><div class="metric">${v}</div></div>`).join('')}</div><h2>Histórico de tiragens</h2><p>${inventory[selected].produced?"Tiragem demonstrativa · 500 exemplares":"Nenhuma tiragem registrada"}</p><button onclick="go(3)">Ver vendas e estoque</button>`:tab===2?documentsView(true):tab===4?financeView(true): `<h2>${ts[tab]}</h2><p>Área reservada para registros da obra. Integração e edição ainda não implementadas.</p>`}</div>`}else if(page===3){h=stockView()}else if(page===4){h=financeView()}else if(page===5){h=documentsView()}else if(page===6){h=noticesView()}else if(page===7){h=teamView()}else if(page===8){h=settingsView()}else{h=`<h1>${sections[page]}</h1><div class="panel"><p>Área prevista para a próxima etapa do protótipo.</p>${page===1?books.map(b=>`<div class="line"><b>${b.author}</b><p>${b.title}</p></div>`).join(''):''}</div>`}main.innerHTML=h+'<footer>Singularity Digital · Protótipo administrativo · Dados ilustrativos</footer>';if(page===5||(page===2&&selected>=0&&tab===2)){document.getElementById('docSearch').value=docQ;refreshDocs(page===2)}if(page===3){document.getElementById('stockSearch').value=stockQ}if(page===1&&authorSelected<0){document.getElementById('authorSearch').value=authorQ;authorList()}if(page===2&&selected<0){document.getElementById('search').value=q;shelf()}}render();</script></html>
